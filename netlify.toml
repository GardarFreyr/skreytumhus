[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Skrár sem vantar í /assets/ (t.d. gamlar JS-skrár eftir nýja útgáfu) fá raunverulegt 404,
# ekki index.html – annars reynir vafrinn að keyra HTML sem JS-einingu og síðan verður auð.
# (Gildir aðeins ef skráin er ekki til; til staðar skrár eru alltaf afgreiddar beint.)
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# SPA: allar leiðir í index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Demo má ekki keppa við skreytumhus.is í leitarniðurstöðum
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html má aldrei geymast: nýr flipi á alltaf að fá nýjustu skráaheitin
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
